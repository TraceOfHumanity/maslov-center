<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-gold.svg" />
    <link rel="apple-touch-icon" href="/logo-gold.svg" />
    <link rel="canonical" href="https://www.maslov-center.com" />
    <meta
      name="description"
      content="Високоякісний масаж, йога та реабілітація в Сумах, Україна. Запишіться на сеанс до наших спеціалістів вже сьогодні!"
    />
    <meta name="keywords" content="масаж, реабілітація, йога, фітобочка" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Маслов Центр" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/roboto/files/roboto-cyrillic-wght-normal.woff2" />
    <title>Маслов Центр | Реабілітація | Масаж | Йога | Суми</title>
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: Arial, sans-serif;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid #333;
        border-top: 3px solid #bdbdbd;
        border-bottom: 3px solid #bdbdbd;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 1px;
      }
      
      .loading-subtitle {
        font-size: 14px;
        color: #888;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-spinner"></div>
      
      <div class="loading-subtitle">Завантаження...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        var loadingScreen = document.getElementById('loading-screen');
        if (!loadingScreen) return;
        loadingScreen.style.transition = 'opacity 0.3s ease-out';
        loadingScreen.style.opacity = '0';
        setTimeout(function() {
          loadingScreen.style.display = 'none';
        }, 300);
      });
    </script>
  </body>
</html>
